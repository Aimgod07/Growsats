<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0c1b18"><title>Inkblade Dojo</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="game" aria-label="Inkblade Dojo martial arts fighting game"></canvas>
<div id="hud"><div class="fighter-card left"><div class="portrait">影</div><div><b>KAITO</b><div class="bar"><i id="hp1"></i></div></div></div><div id="clock">60</div><div class="fighter-card right"><div><b>RYUJI</b><div class="bar"><i id="hp2"></i></div></div><div class="portrait enemy">龍</div></div></div>
<button id="pause" aria-label="Pause game">Ⅱ</button><div id="combo"></div>
<div id="controls"><div id="stick"><i></i><span>MOVE</span></div><div class="actions"><button data-action="block" class="guard" aria-label="Block">◆</button><button data-action="punch" class="punch" aria-label="Punch">拳</button><button data-action="kick" class="kick" aria-label="Kick">脚</button></div></div>
<section id="menu"><div class="seal">墨</div><p class="eyebrow">GROGAMES ORIGINAL</p><h1>INKBLADE<br><em>DOJO</em></h1><p>Move like water. Strike like ink.<br>Master fluid martial arts against the dojo's champion.</p><div class="modes"><button data-difficulty="0.72">APPRENTICE</button><button class="selected" data-difficulty="1">WARRIOR</button><button data-difficulty="1.28">MASTER</button></div><button id="start">ENTER THE DOJO <span>→</span></button><small>Drag the movement ring · tap 拳 to punch · 脚 to kick · hold ◆ to guard</small></section>
<section id="result" hidden><p class="eyebrow" id="result-kicker">DUEL COMPLETE</p><h2 id="result-title">VICTORY</h2><div class="score"><span>SCORE</span><b id="score">0</b></div><button id="again">FIGHT AGAIN <span>→</span></button></section>
<section id="pause-menu" hidden><p class="eyebrow">THE DOJO WAITS</p><h2>PAUSED</h2><button id="resume">RETURN TO FIGHT</button><button id="restart">RESTART DUEL</button></section>
<script src="game.js"></script></body></html>
