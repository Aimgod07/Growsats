<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Touch — Embed example</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e9eddc;color:#234944;font-family:Arial,sans-serif}header{max-width:1400px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:19px;margin:0}p{font-size:12px;color:#62776a;margin:6px 0 0}button{border:1px solid #8fa68e;background:transparent;padding:10px 14px;color:#234944;border-radius:5px;cursor:pointer}iframe{display:block;width:100%;max-width:1400px;height:85dvh;min-height:560px;margin:auto;border:0;border-radius:12px;box-shadow:0 15px 55px #23494422}@media(max-width:600px){body{padding:10px}header{padding:5px}h1{font-size:16px}p{font-size:10px}iframe{height:85dvh;min-height:620px}}</style></head><body><header><div><h1>First Touch / Your app</h1><p>The complete game runs inside this frame.</p></div><button id="toggle">Pause game</button></header><iframe src="index.html" title="First Touch football game" allow="autoplay; fullscreen"></iframe><script>const frame=document.querySelector('iframe'),button=document.querySelector('button');let paused=false;button.onclick=()=>{paused=!paused;frame.contentWindow.postMessage({type:'first-touch:'+(paused?'pause':'resume')},location.origin==='null'?'*':location.origin);button.textContent=paused?'Resume game':'Pause game';};addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==='first-touch:pause')paused=true;if(['first-touch:resume','first-touch:start'].includes(e.data?.type))paused=false;button.textContent=paused?'Resume game':'Pause game';});</script></body></html>
