<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archery 3D</title>
<style>
  :root{--ink:#fff;--shade:rgba(0,0,0,.45)}
  html,body{margin:0;height:100%;overflow:hidden;background:#9bd1f5;touch-action:none;font-family:Arial,Helvetica,sans-serif;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;inset:0;pointer-events:none;color:var(--ink);text-shadow:0 1px 4px #000;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  .top{display:flex;justify-content:space-between;padding:12px 16px;font-weight:bold;font-size:clamp(14px,3.6vw,22px)}
  .pill{background:var(--shade);border-radius:12px;padding:6px 12px}
  #cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #fff;border-radius:50%;opacity:.85}
  #cross:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#f33;border-radius:50%}
  #pw{position:absolute;left:50%;bottom:7%;width:min(60vw,320px);height:14px;transform:translateX(-50%);background:var(--shade);border-radius:8px;overflow:hidden}
  #pwf{height:100%;width:0;background:linear-gradient(90deg,#4ade80,#facc15,#ef4444)}
  #hint{position:absolute;left:0;right:0;bottom:11%;text-align:center;font-size:clamp(12px,3vw,16px);opacity:.9}
  #msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(22px,6vw,40px);font-weight:bold;opacity:0;transition:opacity .25s}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,20,40,.72);color:#fff;text-align:center;padding:20px;gap:10px}
  #ov h1{margin:0;font-size:clamp(30px,9vw,56px)} #ov p{margin:0;font-size:clamp(14px,3.6vw,20px);max-width:420px}
  button{font:bold 22px Arial;padding:14px 34px;border:0;border-radius:30px;background:#facc15;color:#1a1a1a;cursor:pointer;margin-top:8px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="/grogames/visuals/studio.css"><script src="/grogames/visuals/studio.js"></script><link rel="stylesheet" href="ui-polish.css"><script defer src="ui-polish.js"></script><script src="/grogames/score-bridge.js"></script></head>
<body>
<div id="hud">
  <div class="top"><span class="pill" id="sc">Score 0</span><span class="pill" id="ar">Arrow 1/10</span><span class="pill" id="di">20 m</span><span class="pill" id="wi">Wind 0</span></div>
  <div id="cross"></div><div id="msg"></div>
  <div id="hint">Hold to draw · drag to aim · release to shoot</div>
  <div id="pw"><div id="pwf"></div></div>
</div>
<div id="ov"><h1 id="ot">ARCHERY 3D</h1><p id="op">10 arrows, targets get farther. Hold to draw the bow, drag to aim (aim a bit high at long range), release to shoot. Watch the wind!</p><button id="ob">START</button></div>
<script>
/* ============ CONFIG ============ */
const ARROWS=10, DISTS=[15,20,25,30,35,40,45,50,55,60], EYE=1.6, TY=1.3, TR=.61;
const GRAVITY=9.8, MIN_SPEED=25, MAX_SPEED=70, DRAW_TIME=1.2;
const MOVE_FROM=6;                 // arrow number from which the target moves sideways
const DEV_FALLBACK=true;           // no URL params => demo ids + "*" origin (DEV ONLY; set false in production)

/* ============ BRIDGE ============ */
const Bridge=(()=>{
  const q=new URLSearchParams(location.search),ok=v=>v&&/^[A-Za-z0-9_-]{1,64}$/.test(v)?v:null;
  let gameId=ok(q.get("gameId")),playerId=ok(q.get("playerId")),dev=false,error=null,origin=null;
  try{origin=q.get("parentOrigin")?new URL(q.get("parentOrigin")).origin:(document.referrer?new URL(document.referrer).origin:null);}catch(e){}
  if(DEV_FALLBACK&&!q.get("gameId")&&!q.get("playerId")){dev=true;gameId="DEMO_GAME";playerId="DEMO_PLAYER";}
  else if(!gameId||!playerId)error="Missing or invalid gameId / playerId in the URL.";
  const target=origin||(dev?"*":null),submitUrl=q.get("submitUrl"),hs={};
  function send(type,data={}){const m=Object.assign({type,gameId,playerId},data);
    if(window.parent!==window&&target)window.parent.postMessage(m,target);if(dev)console.log("[bridge]",m);return m;}
  async function submit(p){if(!submitUrl)return;for(let i=0;i<2;i++){try{const r=await fetch(submitUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});if(r.ok)return;}catch(e){}}}
  window.addEventListener("message",e=>{if(!(dev||(origin&&e.origin===origin)))return;const f=hs[e.data&&e.data.type];if(f)f();});
  return{error,send,submit,on:(t,f)=>hs[t]=f};
})();
let actx=null;
function beep(a,b,d,type="triangle",v=.08){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
  const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type=type;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){}}

/* ============ SCENE ============ */
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd1f5);scene.fog=new THREE.Fog(0x9bd1f5,50,200);
const cam=new THREE.PerspectiveCamera(45,1,.05,400);cam.rotation.order="YXZ";scene.add(cam);
scene.add(new THREE.HemisphereLight(0xffffff,0x4c7a2a,.9));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(-20,40,10);scene.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600).rotateX(-Math.PI/2),M(0x4c9a2a));scene.add(ground);
for(let d=10;d<=60;d+=5){const l=new THREE.Mesh(new THREE.PlaneGeometry(d%10?1:3,.12).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff}));l.position.set(-2.5,.02,-d);scene.add(l);}
for(let i=0;i<70;i++){const t=new THREE.Group(),x=(Math.random()<.5?-1:1)*(10+Math.random()*70),z=-Math.random()*140+10,h=3+Math.random()*4;
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,h*.4,6),M(0x6b4423));tr.position.y=h*.2;
  const fo=new THREE.Mesh(new THREE.ConeGeometry(1.6+Math.random(),h,7),M(0x1f6b2c));fo.position.y=h*.4+h*.45;t.add(tr,fo);t.position.set(x,0,z);scene.add(t);}
for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(50+Math.random()*30,60+Math.random()*40,5),M(0x7a8fa6));m.position.set(-200+i*70,20,-230);scene.add(m);}

function makeArrow(){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.8,6).rotateX(Math.PI/2),M(0xd6b36a)));
  const tip=new THREE.Mesh(new THREE.ConeGeometry(.02,.08,6).rotateX(Math.PI/2),M(0x999999));tip.position.z=.44;g.add(tip);
  [0,Math.PI/2].forEach(a=>{const f=new THREE.Mesh(new THREE.BoxGeometry(.004,.05,.16),M(0xdc2626));f.position.z=-.34;f.rotation.z=a;g.add(f);});
  return g;
}
function makeTarget(){
  const g=new THREE.Group(),cols=[0xf5f5f5,0x222222,0x2a6fdb,0xdc2626,0xfacc15];
  const boss=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,.2,32).rotateX(Math.PI/2),M(0xd9b779));boss.position.z=-.11;g.add(boss);
  cols.forEach((c,i)=>{const r=new THREE.Mesh(new THREE.CircleGeometry(TR*(5-i)/5,48),new THREE.MeshBasicMaterial({color:c}));r.position.z=.002*(i+1);g.add(r);});
  [-.45,.45].forEach(x=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.06,TY,.06),M(0x6b4423));l.position.set(x,-TY/2,-.25);g.add(l);});
  return g;
}
// bow (attached to camera)
const bow=new THREE.Group();cam.add(bow);bow.position.set(.14,-.14,-.5);
bow.add(new THREE.Mesh(new THREE.TorusGeometry(.28,.012,8,32,Math.PI).rotateZ(-Math.PI/2).rotateY(Math.PI/2),M(0x5a3a1a)));
const strGeo=new THREE.BufferGeometry().setAttribute("position",new THREE.BufferAttribute(new Float32Array(9),3));
bow.add(new THREE.Line(strGeo,new THREE.LineBasicMaterial({color:0xffffff})));
const bowArrow=makeArrow();bowArrow.rotation.y=Math.PI;bow.add(bowArrow);
function pullBow(p){const z=p*.35,a=strGeo.attributes.position;a.setXYZ(0,0,.28,0);a.setXYZ(1,0,0,z);a.setXYZ(2,0,-.28,0);a.needsUpdate=true;bowArrow.position.z=z-.4;}

/* ============ GAME STATE ============ */
let state="ready",idx=0,score=0,bulls=0,best=0,yaw=0,pitch=0,drawing=false,drawT=0,wind=0,D=15,tgt=null,arrow=null,vel=new THREE.Vector3(),
    tNow=0,ph=0,moving=false,missInfo=null,crossed=false,wait=0,t0=0,runId="",lx=0,ly=0,keys={},fov=45;
const tx=t=>moving?Math.sin(t*.7+ph)*3:0;
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener("resize",resize);resize();

function say(s,ms=1600){const m=$("msg");m.textContent=s;m.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>m.style.opacity=0,ms);}
function hud(){$("sc").textContent="Score "+score;$("ar").textContent="Arrow "+Math.min(idx,ARROWS)+"/"+ARROWS;$("di").textContent=D+" m";
  $("wi").textContent="Wind "+(wind<0?"← ":wind>0?"→ ":"")+Math.abs(wind).toFixed(1);}
function startGame(){PlaylootScores.start();
  idx=0;score=0;bulls=0;t0=performance.now();runId=crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
  $("ov").style.display="none";Bridge.send("GAME_STARTED",{runId});nextArrow();
}
function nextArrow(){
  idx++;D=DISTS[idx-1];wind=Math.round((Math.random()*10-5)*10)/10;moving=idx>=MOVE_FROM;ph=Math.random()*6;
  if(tgt)scene.remove(tgt);if(arrow&&!arrow.parent.isScene){}
  tgt=makeTarget();tgt.position.set(tx(tNow),TY,-D);scene.add(tgt);arrow=null;
  cam.position.set(0,EYE,0);bow.visible=true;pullBow(0);drawing=false;drawT=0;state="aim";hud();
}
function shoot(){
  const p=Math.min(1,drawT/DRAW_TIME),dir=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion).normalize();
  vel.copy(dir).multiplyScalar(MIN_SPEED+p*(MAX_SPEED-MIN_SPEED));
  arrow=makeArrow();arrow.position.copy(cam.position).addScaledVector(dir,.6);scene.add(arrow);
  bow.visible=false;drawing=false;$("pwf").style.width="0";crossed=false;missInfo=null;state="fly";beep(500,150,.25,"sawtooth",.06);
}
function finish(hit,r){
  state="result";wait=1.8;
  if(hit){const s=Math.max(1,10-Math.floor(r/.061));score+=s;if(s===10)bulls++;say(s===10?"BULLSEYE! +10":"+"+s+" points");beep(600,1100,.2);}
  else{const m=missInfo;say(m?"Missed: "+Math.abs(m.ey).toFixed(1)+" m "+(m.ey<0?"low":"high")+", "+Math.abs(m.ex).toFixed(1)+" m "+(m.ex<0?"left":"right"):"Fell short!",2000);beep(200,90,.25,"square");}
  hud();Bridge.send("SCORE_UPDATE",{runId,score,arrowsShot:idx});
}
function gameOver(){
  state="over";PlaylootScores.finish(score);best=Math.max(best,score);
  const msg=Bridge.send("GAME_OVER",{runId,score,maxScore:ARROWS*10,arrows:ARROWS,bullseyes:bulls,durationMs:Math.round(performance.now()-t0),timestamp:Date.now()});Bridge.submit(msg);
  $("ot").textContent="SCORE "+score+" / "+ARROWS*10;$("op").textContent="Bullseyes: "+bulls+"  ·  Best this session: "+best;$("ob").textContent="PLAY AGAIN";$("ov").style.display="flex";
}

/* ============ INPUT ============ */
const radPerPx=()=>cam.fov*Math.PI/180/innerHeight;
addEventListener("pointerdown",e=>{if(state!=="aim"||e.target.closest("#ov"))return;drawing=true;drawT=0;lx=e.clientX;ly=e.clientY;beep(150,200,.1,"sine",.03);});
addEventListener("pointermove",e=>{if(!drawing)return;const k=radPerPx();yaw-=(e.clientX-lx)*k;pitch-=(e.clientY-ly)*k;lx=e.clientX;ly=e.clientY;});
["pointerup","pointercancel"].forEach(ev=>addEventListener(ev,()=>{if(drawing&&state==="aim")shoot();}));
addEventListener("keydown",e=>{if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();keys[e.code]=1;
  if(e.code==="Space"&&state==="aim"&&!drawing&&!e.repeat){drawing=true;drawT=0;}});
addEventListener("keyup",e=>{keys[e.code]=0;if(e.code==="Space"&&drawing&&state==="aim")shoot();});
addEventListener("pointerdown",()=>window.focus());
$("ob").onclick=startGame;

/* ============ LOOP ============ */
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);tNow+=dt;
  if(tgt)tgt.position.x=tx(tNow);
  if(state==="aim"){
    const k=dt*cam.fov*Math.PI/180*.6;
    if(keys.ArrowLeft)yaw+=k;if(keys.ArrowRight)yaw-=k;if(keys.ArrowUp)pitch+=k;if(keys.ArrowDown)pitch-=k;
    yaw=Math.max(-.8,Math.min(.8,yaw));pitch=Math.max(-.3,Math.min(.6,pitch));
    if(drawing)drawT+=dt;const p=Math.min(1,drawT/DRAW_TIME);$("pwf").style.width=(p*100)+"%";pullBow(drawing?p:0);
    const zoom=Math.max(7,320/D),tf=drawing?zoom:45;fov+=(tf-fov)*Math.min(1,dt*8);cam.fov=fov;cam.updateProjectionMatrix();
    const sw=drawing?.0012:.0005;cam.position.set(0,EYE,0);
    cam.rotation.set(pitch+Math.sin(tNow*1.7)*sw,yaw+Math.cos(tNow*1.3)*sw,0);
    bow.visible=true;
  }else if(state==="fly"){
    const steps=Math.ceil(dt/(1/120)),h=dt/steps;
    for(let i=0;i<steps&&state==="fly";i++){
      const prev=arrow.position.clone();
      vel.x+=wind*.25*h;vel.y-=GRAVITY*h;arrow.position.addScaledVector(vel,h);
      arrow.lookAt(arrow.position.clone().add(vel));
      if(!crossed&&prev.z>-D&&arrow.position.z<=-D){
        crossed=true;const t=(prev.z+D)/(prev.z-arrow.position.z),hit=prev.clone().lerp(arrow.position,t);
        const ex=hit.x-tgt.position.x,ey=hit.y-TY,r=Math.hypot(ex,ey);
        if(r<TR){arrow.position.copy(hit).addScaledVector(vel.clone().normalize(),.3);tgt.attach(arrow);finish(true,r);}
        else missInfo={ex,ey};
      }else if(arrow.position.y<=0){arrow.position.y=0;finish(false);}
    }
    if(state==="fly"&&arrow.position.z<-D-60)finish(false);
    chase(dt);
  }else if(state==="result"){
    wait-=dt;chase(dt);
    if(wait<=0){if(idx>=ARROWS)gameOver();else nextArrow();}
  }
  renderer.render(scene,cam);
}
function chase(dt){
  fov+=(55-fov)*Math.min(1,dt*5);cam.fov=fov;cam.updateProjectionMatrix();
  const wp=new THREE.Vector3();arrow.getWorldPosition(wp);
  const dir=state==="fly"?vel.clone().normalize():new THREE.Vector3(0,0,-1);
  cam.position.lerp(wp.clone().addScaledVector(dir,-3.2).add(new THREE.Vector3(0,.7,0)),Math.min(1,dt*6));
  cam.lookAt(wp);bow.visible=false;
}
if(Bridge.error){$("ot").textContent="Setup error";$("op").textContent=Bridge.error;$("ob").style.display="none";}
else Bridge.send("GAME_READY");
document.addEventListener("visibilitychange",()=>{if(document.hidden)clock.stop();else clock.start();});
Bridge.on("PAUSE",()=>clock.stop());Bridge.on("RESUME",()=>clock.start());Bridge.on("RESTART",()=>{if(!Bridge.error)startGame();});
frame();
</script>
<script defer src="/grogames/audio-effects.js"></script></body>
</html>
