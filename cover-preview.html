<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playloot · Cover gallery</title><style>body{margin:0;padding:32px;background:#0d111c;color:#fff;font:16px system-ui}h1{font-size:32px}p{color:#9baac3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}.card{background:#1a2131;border-radius:18px;overflow:hidden;border:1px solid #ffffff15}.grogames-art{aspect-ratio:4/3;overflow:hidden}.grogames-art img{width:100%;height:100%;object-fit:cover}.card strong{display:block;padding:14px}</style><h1>Gro Games · Cover collection</h1><p>Original illustrations, lightweight motion. Motion stops when artwork leaves the screen.</p><main class="grid"></main><script type="module">import {installCoverMotion} from '/src/utils/coverMotion.js';const games=await fetch('/grogames/manifest.json').then(r=>r.json());for(const g of games){const card=document.createElement('article');card.className='card';const art=document.createElement('div');art.className='grogames-art';const img=document.createElement('img');img.src=g.cover;img.alt=g.title;img.loading='lazy';art.append(img);const title=document.createElement('strong');title.textContent=g.title;card.append(art,title);document.querySelector('main').append(card);}installCoverMotion();</script></html>
