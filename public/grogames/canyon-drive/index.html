<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ac5737"><title>Canyon Drive · PlayLoot</title><link rel="stylesheet" href="style.css"></head><body><main id="stage"><canvas id="scene" aria-label="Canyon driving course"></canvas><div id="hud" hidden><div><small>COINS</small><b id="coins">0</b></div><div><small>CHECKPOINT</small><b id="checkpoint">0 / 4</b></div><div><small>TIME</small><b id="time">3:00</b></div></div><div id="tools"><button id="sound" aria-label="Mute sound">♪</button><button id="pause" aria-label="Pause driving" hidden>Ⅱ</button></div><div id="notice" role="status"></div><div id="speed" hidden>0 <small>KM/H</small></div><section id="menu"><div class="menu-card"><p class="eyebrow">THE HIGH DESERT</p><h1>Canyon<br><em>Drive.</em></h1><p id="description">Choose your ride. Keep your wheels on the trail.</p><div id="vehicles" role="group" aria-label="Choose vehicle"><button data-car="coupe"><b>Coupe</b><small>Fast & agile</small></button><button data-car="pickup" class="selected"><b>Pickup</b><small>Balanced grip</small></button><button data-car="van"><b>Van</b><small>Steady cruiser</small></button></div><button id="start" disabled>Loading vehicles…</button><p class="instructions">Arrow keys or WASD to drive. Use the pedals and steering buttons on mobile.</p></div></section><section id="result" hidden><div class="menu-card"><p class="eyebrow" id="result-label">TRAIL COMPLETE</p><h2 id="result-title">You made it.</h2><p id="result-info"></p><button id="again">Drive again</button><button id="garage">Choose vehicle</button></div></section><div id="controls" hidden><div class="steering"><button data-control="left" aria-label="Steer left">◀</button><button data-control="right" aria-label="Steer right">▶</button></div><div class="pedals"><button data-control="brake" aria-label="Brake or reverse">BRAKE</button><button data-control="gas" aria-label="Accelerate">GAS</button></div></div><div id="paused" hidden><div class="menu-card"><h2>Parked.</h2><button id="resume">Keep driving</button><button id="restart">Restart trail</button><button id="exit">Choose vehicle</button></div></div></main><script src="../score-bridge.js"></script><script src="../strikepoint/assets/three.min.js"></script><script type="module" src="game.js"></script></body></html>
